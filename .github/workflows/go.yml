# This workflow will auto check frp latest version, build and release
name: Auto Build & Release

on:
  # 定时任务：每天 0 点检测新版本（UTC时间，国内为8点）
  schedule:
    - cron: '0 0 * * *'
  # 手动触发构建（测试/紧急用）
  workflow_dispatch:
  # 原有的代码推送/PR触发
  push:
    branches: [ "auto" ]
  pull_request:
    branches: [ "auto" ]

jobs:
  # 检测最新版本并更新 frpVersion.txt
  check-latest-version:
    runs-on: ubuntu-latest
    outputs:
      LATEST_VERSION: ${{ steps.get-latest-version.outputs.LATEST_VERSION }} # 传递最新版本号给 build 作业
    steps:
      - uses: actions/checkout@v4

      # 安装 jq（用于解析 GitHub API 返回的 JSON）
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # 调用 GitHub API 获取 frp 最新 Release 版本
      - name: Get Latest frp Version
        id: get-latest-version
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/fatedier/frp/releases/latest | jq -r '.tag_name')
          echo "LATEST_VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "$LATEST_TAG" > frpVersion.txt
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add frpVersion.txt
          git commit -m "Auto update frp version to $LATEST_TAG"
          git push

  # 构建并发布新版本（仅当版本更新/手动触发/代码推送时执行）
  build:
    needs: check-latest-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c

      - name: Build
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export GO111MODULE=on

          # 下载并安装 UPX
          wget https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xf upx-4.2.4-amd64_linux.tar.xz
          export PATH=$(pwd)/upx-4.2.4-amd64_linux:$PATH
          
          # 获取最新版本号（去除 v 前缀）
          VERSION=$(echo "${{ needs.check-latest-version.outputs.LATEST_VERSION }}" | sed 's/^v//')
          echo "Building frp version: $VERSION" # 输出实际用于构建的版本号
          ./build-android.sh $VERSION

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check-latest-version.outputs.LATEST_VERSION }}
          release_name: Auto Release ${{ needs.check-latest-version.outputs.LATEST_VERSION }}
          draft: false  # 自动发布为正式版本
          prerelease: false

      - name: Upload files to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-latest-version.outputs.LATEST_VERSION }}
        run: |
          cd frp/bin/upx/
          for file in *; do
            if [[ -f ${file} ]]; then
              echo "Uploading file: $file"
              gh release upload "$VERSION" "$file" --repo ${{ github.repository }}
            fi
          done

      - name: Generate Download Config (MD5)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run genDownloadConfig.go -d ./frp/bin/upx -v "${{ needs.check-latest-version.outputs.LATEST_VERSION }}" > download-config.json
          gh release upload "${{ needs.check-latest-version.outputs.LATEST_VERSION }}" download-config.json --repo ${{ github.repository }}    
