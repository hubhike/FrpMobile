# This workflow will build FRP for Android and create a release with validated versions
name: FRP Android Build

on:
  push:
    branches: [ "auto" ]  # 仅在 auto 分支推送时触发
  pull_request:
    branches: [ "auto" ]  # 监听 auto 分支的 PR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # 检出当前仓库（auto 分支）

    - name: Set up Go 1.23
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Setup Android NDK r23c
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r23c  # 固定 NDK 版本确保一致性

    - name: Get Target FRP Version
      id: get_tag
      run: |
        TAG=$(cat frpVersion.txt)
        echo "::set-output name=VERSION::$TAG"
        echo "目标构建版本：$TAG"

    # 新增：验证 FRP 官方仓库是否存在目标标签（核心防错）
    - name: Validate FRP Tag Exists
      run: |
        TAG=${{ steps.get_tag.outputs.VERSION }}
        # 检查 fatedier/frp 仓库是否存在该标签
        if ! git ls-remote --tags https://github.com/fatedier/frp.git "refs/tags/$TAG" | grep -q "$TAG"; then
          echo "❌ 错误：FRP 官方仓库不存在标签 $TAG，终止构建！"
          exit 1
        fi
        echo "✅ FRP 标签 $TAG 存在，继续构建..."

    - name: Build with Error Handling
      # 关键：启用 -e（命令失败立即终止）和 -o pipefail（管道命令失败也终止）
      run: |
        set -euo pipefail
        export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        export GO111MODULE=on

        # 下载并校验 UPX（新增安全校验）
        UPX_VERSION="4.2.4"
        UPX_FILE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
        UPX_URL="https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_FILE}"
        EXPECTED_SHA256="d3b6c6e3a7a3c6f0e8d5e5a0a5c6b5d7e7a3c6f0e8d5e5a0a5c6b5d7e7a3c6f0"  # 替换为实际 SHA256 哈希
        
        wget -q "$UPX_URL"
        ACTUAL_SHA256=$(sha256sum "$UPX_FILE" | awk '{print $1}')
        if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
          echo "❌ UPX 下载文件哈希不匹配，可能被篡改！"
          exit 1
        fi
        
        tar -xf "$UPX_FILE"
        export PATH=$(pwd)/upx-${UPX_VERSION}-amd64_linux:$PATH

        # 执行构建脚本（已同步修改 build-android.sh 错误处理）
        ./build-android.sh "${{ steps.get_tag.outputs.VERSION }}"

    # 新增：验证构建产物版本（确保二进制文件版本正确）
    - name: Verify Build Artifact Version
      run: |
        # 假设 upx_test.sh 支持传入架构和预期版本
        SUPPORTED_ARCHS=("arm64" "arm" "x86" "x86_64")
        for arch in "${SUPPORTED_ARCHS[@]}"; do
          if ! ./upx_test.sh "$arch" "${{ steps.get_tag.outputs.VERSION }}"; then
            echo "❌ $arch 架构构建产物版本验证失败！"
            exit 1
          fi
          echo "✅ $arch 架构版本验证通过"
        done

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_tag.outputs.VERSION }}  # 使用 frpVersion.txt 的标签
        release_name: FRP Android Auto Build ${{ steps.get_tag.outputs.VERSION }}
        draft: false  # 直接发布非草稿版本（根据需求调整）
        prerelease: false

    - name: Upload Build Artifacts
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_tag.outputs.VERSION }}
      run: |
        cd frp/bin/upx/
        # 上传所有构建产物（过滤目录）
        for file in *; do
          if [[ -f "$file" ]]; then
            echo "上传文件：$file"
            gh release upload "$VERSION" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          fi
        done

    - name: Generate Download Config
      run: |
        go run genDownloadConfig.go -d ./frp/bin/upx
