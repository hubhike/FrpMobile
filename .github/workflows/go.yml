# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "one" ]
  pull_request:
    branches: [ "one" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r23c

    - name: Get Tag
      id: get_tag
      run: echo "::set-output name=VERSION::$(cat frpVersion.txt)"

    - name: Build
      run: |
        export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        export GO111MODULE=on

        # 下载并安装UPX
        wget https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
        tar -xf upx-4.2.4-amd64_linux.tar.xz
        export PATH=$(pwd)/upx-4.2.4-amd64_linux:$PATH
        
        # 执行构建脚本（参数为frp版本号）
        ./build-android.sh $(cat frpVersion.txt)

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          tag_name: ${{ steps.get_tag.outputs.VERSION }}
          release_name: Auto Release ${{ steps.get_tag.outputs.VERSION }}
          draft: true
          prerelease: false

    - name: Generate Download Config
      run: |
        # 运行genDownloadConfig.go并将输出保存为download-config.json
        go run genDownloadConfig.go -d ./frp/bin/upx -version ${{ steps.get_tag.outputs.VERSION }} > download-config.json

    - name: Upload files to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_tag.outputs.VERSION }}
      run: |
        # 上传二进制文件
        cd frp/bin/upx/
        for file in *; do
          if [[ -f ${file} ]]; then
              echo "Uploading binary file: $file"
              gh release upload "$VERSION" "$file" --repo ${{ github.repository }}
          fi
        done

        # 回到根目录，上传JSON配置文件
        cd ../../../
        echo "Uploading download-config.json"
        gh release upload "$VERSION" download-config.json --repo ${{ github.repository }}
