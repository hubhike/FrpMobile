name: Go Build and Release

on:
  # 1. 推送到 main 分支且修改了 frpVersion.txt 时触发
  push:
    branches: [ "main" ]  # 监听 main 分支（根据实际调整）
    paths:  # 仅当以下文件修改时触发（可选，精确控制）
      - "frpVersion.txt"  # 关键：明确监听 frpVersion.txt
      - ".github/workflows/go.yml"  # 监听工作流文件自身修改
  # 2. 针对 main 分支的 PR 触发（无论修改哪个文件）
  pull_request:
    branches: [ "main" ]
  # 3. 手动触发（方便测试）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # 检出代码（必须步骤）

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'  # 根据项目需求调整

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r23c  # 根据项目需求调整

    - name: Get Tag  # 从 frpVersion.txt 读取版本号
      id: get_tag
      run: |
        # 读取文件内容并去除前缀 v（如 v0.62.1 → 0.62.1）
        VERSION=$(cat frpVersion.txt | sed 's/^v//')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Build FRP Binaries
      run: |
        export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
        export GO111MODULE=on

        # 安装 UPX 压缩工具
        wget https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
        tar -xf upx-4.2.4-amd64_linux.tar.xz
        export PATH=$(pwd)/upx-4.2.4-amd64_linux:$PATH
        
        # 执行构建脚本（传递带 v 的版本号）
        ./build-android.sh "$(cat frpVersion.txt)"

    - name: Generate download_config.json
      run: |
        # 动态生成下载链接（版本号从 frpVersion.txt 获取）
        VERSION=$(cat frpVersion.txt)
        BASE_URL="https://github.com/hubhike/FrpMobile/releases/download/${VERSION}/"

        # 运行工具生成 JSON（假设工具支持 -base-url 参数）
        go run genDownloadConfig.go \
          -d ./frp/bin/upx \
          -o download_config.json \
          -base-url "$BASE_URL"

        # 验证文件生成（失败时终止流程）
        if [[ ! -f download_config.json ]]; then
          echo "❌ download_config.json 生成失败"
          exit 1
        fi

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_tag.outputs.VERSION }}  # 版本标签（如 0.62.1）
        release_name: Release ${{ steps.get_tag.outputs.VERSION }}
        draft: false  # 设为 false 自动发布
        prerelease: false

    - name: Upload Files to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.get_tag.outputs.VERSION }}
      run: |
        # 上传 FRP 二进制文件
        cd frp/bin/upx/
        for file in *; do
          if [[ -f "$file" ]]; then
            echo "📤 上传 $file 到 Release"
            gh release upload "$VERSION" "$file" --repo hubhike/FrpMobile
          fi
        done

        # 上传 download_config.json
        cd ../../..
        if [[ -f download_config.json ]]; then
          echo "📤 上传 download_config.json 到 Release"
          gh release upload "$VERSION" "download_config.json" --repo hubhike/FrpMobile
        else
          echo "❌ download_config.json 未找到，上传失败"
          exit 1
        fi
